name: crashaid
description: "CrashAid - AI-powered crash detection and emergency response app."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  go_router: ^13.0.0 
  cloud_firestore: ^5.0.0 
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.2
  geolocator: ^11.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1
  flutter_tts: ^4.2.0
  shared_preferences: ^2.2.2
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.7
  google_sign_in: ^6.2.1
  permission_handler: ^11.3.1
  sensors_plus: ^4.0.2
  flutter_riverpod: ^2.5.1
  flutter_foreground_task: ^8.13.0
  responsive_framework: ^1.5.1
  google_mlkit_face_detection: ^0.13.1
  camera: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/places.db
    - assets/logo.png
