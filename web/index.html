<body style="background-color: #0A0A0F; margin: 0; padding: 0;">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.startSpeechRecognition = function(triggerWords) {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        return false;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      window._speechRecognition = new SpeechRecognition();
      window._speechRecognition.continuous = true;
      window._speechRecognition.interimResults = false;
      window._speechRecognition.lang = 'en-IN';

      window._speechRecognition.onresult = function(event) {
        const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
        const words = triggerWords || ['help', 'sos', 'emergency', 'bachao'];
        for (let word of words) {
          if (transcript.includes(word)) {
            if (window._speechTriggerCallback) {
              window._speechTriggerCallback(transcript);
            }
            break;
          }
        }
      };

      window._speechRecognition.onerror = function(e) {
        console.log('Speech error:', e.error);
      };

      window._speechRecognition.onend = function() {
        // Auto restart if still active
        if (window._speechActive) {
          window._speechRecognition.start();
        }
      };

      window._speechActive = true;
      window._speechRecognition.start();
      return true;
    };

    window.stopSpeechRecognition = function() {
      window._speechActive = false;
      if (window._speechRecognition) {
        window._speechRecognition.stop();
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
